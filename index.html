<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>TheMaxTool — Upgrading Our Tools (Back in 2 Hours)</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:grid;place-items:center;background:#f7f8fc;color:#111827;font-family:Inter,system-ui,-apple-system,sans-serif;padding:20px;text-align:center}
  .box{max-width:520px;width:100%;background:#fff;border:1px solid #e7eaf1;border-radius:20px;padding:38px 26px;box-shadow:0 16px 40px rgba(26,35,70,.08)}
  .logo{display:inline-flex;align-items:center;gap:10px;font-size:24px;font-weight:900;letter-spacing:-0.8px;margin-bottom:22px}
  .logo span{color:#4f46e5}
  .badge{display:inline-block;background:#eef2ff;color:#4f46e5;font-size:12px;font-weight:800;padding:6px 14px;border-radius:99px;margin-bottom:16px}
  h1{font-size:28px;line-height:1.2;letter-spacing:-0.8px;margin-bottom:12px}
  p{color:#667085;font-size:15px;line-height:1.6;margin-bottom:22px}
  .timer{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px;font-weight:800;font-size:20px;color:#4f46e5;letter-spacing:1px}
  .foot{margin-top:20px;font-size:12px;color:#94a3b8}
</style>
</head>
<body>
  <div class="box">
    <div class="logo"><img src="/logo.svg" alt="TheMaxTool" width="36" height="36" style="border-radius:10px">TheMax<span>Tool</span></div>
    <div class="badge">⚡ SCHEDULED UPGRADE</div>
    <h1>We'll Be Back Soon!</h1>
    <p>We are upgrading <strong>TheMaxTool</strong> with brand-new live previews, faster PDF &amp; Image tools, and an improved interface. All tools will be live shortly.</p>
    <div class="timer" id="cd">Back online in ~2 Hours</div>
    <div class="foot">Thank you for your patience • themaxtool.com</div>
  </div>
  <script>
    let s = 7200;
    setInterval(() => {
      if (s > 0) s--;
      let h = String(Math.floor(s / 3600)).padStart(2, '0');
      let m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
      let sec = String(s % 60).padStart(2, '0');
      document.getElementById('cd').textContent = `Estimated Return: ${h}h : ${m}m : ${sec}s`;
    }, 1000);
  </script>
</body>
</html>
